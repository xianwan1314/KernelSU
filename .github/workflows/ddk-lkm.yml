name: Build KernelSU Kernel Module

on:
  workflow_call:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260828'
        type: string
      expected_size:
        description: 'Expected Manager signature size'
        required: false
        default: ''
        type: string
      expected_hash:
        description: 'Expected Manager signature hash'
        required: false
        default: ''
        type: string
      vivo:
        description: 'Inject vivo vermagic. When true, output is suffixed with _vivo.'
        required: false
        default: false
        type: boolean

jobs:
  build-kernelsu-ko:
    name: Build kernelsu.ko for ${{ inputs.kmi }}${{ inputs.vivo && ' (vivo)' || '' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Inject vivo vermagic
      if: ${{ inputs.vivo }}
      run: |
        set -euo pipefail
        KMI="${{ inputs.kmi }}"
        ANDROID_VER=$(echo "$KMI" | cut -d- -f1 | sed 's/android//')
        KERNEL_VER=$(echo "$KMI" | cut -d- -f2)

        case "$KMI" in
          android12-5.10|android13-5.10)
            UTS_STRING="5.10.233-android12-9-g28b19682acbc-dirty"
            PATCH_UTS="false"
            ;;
          android14-6.1)
            UTS_STRING="6.1.145-android14-11-maybe-dirty"
            PATCH_UTS="true"
            ;;
          *)
            UTS_STRING="${KERNEL_VER}.0-android${ANDROID_VER}-0-maybe-dirty"
            PATCH_UTS="true"
            echo "WARNING: KMI=$KMI uses generic vivo vermagic template."
            ;;
        esac

        VMAGIC_STRING="${UTS_STRING} SMP preempt mod_unload modversions vivo aarch64"
        VERMAGIC_FILE=$(find /opt/ddk -path "*/include/linux/vermagic.h" | head -n 1)
        if [ -z "$VERMAGIC_FILE" ]; then
          echo "ERROR: vermagic.h not found under /opt/ddk"
          exit 1
        fi

        {
          echo ""
          echo "#undef VERMAGIC_STRING"
          echo "#define VERMAGIC_STRING \"$VMAGIC_STRING\""
        } >> "$VERMAGIC_FILE"

        if [ "$PATCH_UTS" = "true" ]; then
          UTS_FILE=$(find /opt/ddk -path "*/include/generated/utsrelease.h" | head -n 1)
          if [ -n "$UTS_FILE" ]; then
            {
              echo ""
              echo "#undef UTS_RELEASE"
              echo "#define UTS_RELEASE \"$UTS_STRING\""
            } >> "$UTS_FILE"
          fi
        fi

    - name: Build kernelsu.ko
      env:
        EXPECTED_SIZE: ${{ inputs.expected_size }}
        EXPECTED_HASH: ${{ inputs.expected_hash }}
      run: |
        git config --global --add safe.directory /__w/KernelSU/KernelSU

        cd kernel

        echo "=== Building kernelsu.ko for KMI: ${{ inputs.kmi }} ==="

        EXTRA_ARGS=""
        if [ -n "$EXPECTED_SIZE" ] && [ -z "$EXPECTED_HASH" ]; then
          echo "ERROR: expected_hash must be provided when expected_size is set."
          exit 1
        fi
        if [ -z "$EXPECTED_SIZE" ] && [ -n "$EXPECTED_HASH" ]; then
          echo "ERROR: expected_size must be provided when expected_hash is set."
          exit 1
        fi
        if [ -n "$EXPECTED_SIZE" ]; then
          EXTRA_ARGS="KSU_EXPECTED_SIZE=$EXPECTED_SIZE KSU_EXPECTED_HASH=$EXPECTED_HASH"
        fi
        CONFIG_KSU=m CC=clang make $EXTRA_ARGS
        
        echo "=== Build completed ==="

        # Create output directory in GitHub workspace
        OUT_DIR=/github/workspace/out/aarch64
        mkdir -p $OUT_DIR

        # Copy with KMI-specific naming
        SUFFIX=""
        if [ "${{ inputs.vivo }}" = "true" ]; then
          SUFFIX="_vivo"
        fi
        OUTPUT_NAME="${{ inputs.kmi }}${SUFFIX}_kernelsu.ko"
        cp kernelsu.ko "$OUT_DIR/$OUTPUT_NAME"
        
        echo "Copied to: $OUT_DIR/$OUTPUT_NAME"
        ls -la "$OUT_DIR/$OUTPUT_NAME"
        echo "Size: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "$OUT_DIR/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"

    - name: Upload kernelsu.ko artifact
      uses: actions/upload-artifact@v7
      with:
        name: aarch64-${{ inputs.kmi }}${{ inputs.vivo && '-vivo' || '' }}-lkm
        path: /github/workspace/out/aarch64/${{ inputs.kmi }}${{ inputs.vivo && '_vivo' || '' }}_kernelsu.ko

    - name: Build kernelsu.ko for x64
      if: ${{ !inputs.vivo }}
      env:
        EXPECTED_SIZE: ${{ inputs.expected_size }}
        EXPECTED_HASH: ${{ inputs.expected_hash }}
      run: |
        cd kernel
        make clean

        echo "=== Preparing KDIR for x64 ==="

        mkdir -p /opt/ddk/kdir-x64
        unset ARCH
        unset CROSS_COMPILE
        export ARCH=x86_64
        kmi=${{ inputs.kmi }}
        pushd /opt/ddk/src/$kmi
        export KDIR=/opt/ddk/kdir-x64/$kmi

        # ddk-min images contain the source tarball, whose modpost patch is
        # not applied to the fresh x86 kdir.  Keep the patch idempotent so
        # this also works when the image already contains one or more fixes.
        MODPOST=scripts/mod/modpost.c
        sed -i -E 's/^([[:space:]]*)check_exports\(mod\);/\1\/\/ check_exports(mod);/' "$MODPOST"
        sed -i -E 's/^([[:space:]]*)s->module = exp->module;/\1\/\/ s->module = exp->module;/' "$MODPOST"
        sed -i 's/^static void check_exports(/static void __attribute__((unused)) check_exports(/' "$MODPOST"
        sed -i 's/__version_ext_names\\") =\\n/__version_ext_names\\") = \\"\\"\\n/' "$MODPOST"

        make O=$KDIR gki_defconfig
        scripts/config --file $KDIR/.config -d LTO_CLANG -e LTO_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL -d THINLTO
        if [ "$kmi" == "android16-6.12" ] || [ "$kmi" == "android17-6.18" ]; then
            scripts/config --file $KDIR/.config -e CONFIG_CFI_ICALL_NORMALIZE_INTEGERS
        fi
        make O=$KDIR modules_prepare
        # Generate SELinux headers through Kbuild in this x86 output tree.
        make O=$KDIR security/selinux/built-in.a
        popd
        
        echo "=== Building x64 kernelsu.ko for KMI: ${{ inputs.kmi }} ==="

        EXTRA_ARGS=""
        if [ -n "$EXPECTED_SIZE" ] && [ -z "$EXPECTED_HASH" ]; then
          echo "ERROR: expected_hash must be provided when expected_size is set."
          exit 1
        fi
        if [ -z "$EXPECTED_SIZE" ] && [ -n "$EXPECTED_HASH" ]; then
          echo "ERROR: expected_size must be provided when expected_hash is set."
          exit 1
        fi
        if [ -n "$EXPECTED_SIZE" ]; then
          EXTRA_ARGS="KSU_EXPECTED_SIZE=$EXPECTED_SIZE KSU_EXPECTED_HASH=$EXPECTED_HASH"
        fi
        
        MDIR=$(realpath .)

        if [ "$kmi" == "android17-6.18" ]; then
          make -C $KDIR M=$MDIR MO=$MDIR compile_commands.json modules CONFIG_KSU=m CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y $EXTRA_ARGS
        else
          make -C $KDIR M=$MDIR src=$MDIR compile_commands.json modules CONFIG_KSU=m CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y $EXTRA_ARGS
        fi
        
        echo "=== Build completed ==="

        # Create output directory in GitHub workspace
        OUT_DIR=/github/workspace/out/x86_64
        mkdir -p $OUT_DIR

        # Copy with KMI-specific naming
        OUTPUT_NAME="${{ inputs.kmi }}_kernelsu.ko"
        cp kernelsu.ko "$OUT_DIR/$OUTPUT_NAME"
        
        echo "Copied to: $OUT_DIR/$OUTPUT_NAME"
        ls -la "$OUT_DIR/$OUTPUT_NAME"
        echo "Size: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "$OUT_DIR/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"
        
    - name: Upload x64 kernelsu.ko artifact
      if: ${{ !inputs.vivo }}
      uses: actions/upload-artifact@v7
      with:
        name: x86_64-${{ inputs.kmi }}-lkm
        path: /github/workspace/out/x86_64/${{ inputs.kmi }}_kernelsu.ko
